<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Player Form</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:include="fragments/nav.html"></div>
<h1 th:if="${player.id == null}">Add Player</h1>
<h1 th:if="${player.id != null}">Edit Player</h1>

<div th:include="fragments/success.html"></div>

<form th:action="@{/players}" th:object="${player}" method="post">
  <input type="hidden" th:field="*{id}" />
  <label for="name">Player Name:</label>
  <input type="text" id="name" th:field="*{name}" placeholder="Enter player name" required />
  <button type="submit">Save</button>
</form>

<footer th:insert="fragments/footer.html"></footer>
</body>
</html>
